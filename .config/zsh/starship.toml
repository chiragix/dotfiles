# ~/.config/zsh/staeship.toml

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
command_timeout = 1000
palette = "tokyonight"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$character"""

right_format = """
$python\
$jobs\
$cmd_duration\
$status"""

[palettes.tokyonight]
rosewater = '#f7768e'
flamingo  = '#ff9e64'
pink      = '#ff007c'
mauve     = '#bb9af7'
red       = '#f7768e'
maroon    = '#db4b4b'
peach     = '#ff9e64'
yellow    = '#e0af68'
green     = '#9ece6a'
teal      = '#73daca'
sky       = '#7dcfff'
sapphire  = '#2ac3de'
blue      = '#7aa2f7'
lavender  = '#9d7cd8'
text      = '#c0caf5'
subtext1  = '#a9b1d6'
subtext0  = '#9aa5ce'
overlay2  = '#737aa2'
overlay1  = '#565f89'
overlay0  = '#414868'
surface2  = '#3b4261'
surface1  = '#283457'
surface0  = '#292e42'
base      = '#1a1b26'
mantle    = '#16161e'
crust     = '#15161e'

[username]
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"
disabled = false

[hostname]
ssh_only = true
style = "bold subtext0"
format = "[@$hostname]($style) "

[directory]
style = "bold sky"
format = "[$path]($style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[status]
disabled = false
format = "[$int( $common_meaning)( $signal_name)]($style) "
style = "bold red"

[git_branch]
symbol = ""
format = "[$symbol $branch](bold mauve) "
truncation_length = 24
truncation_symbol = "…"

[git_state]
style = "bold peach"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead = "[⇡$count ](mauve)"
behind = "[⇣$count ](mauve)"
diverged = "[⇡$ahead_count⇣$behind_count ](mauve)"
staged = "[+$count ](green)"
modified = "[●$count ](yellow)"
untracked = "[?$count ](overlay1)"
deleted = "[✘$count ](red)"
conflicted = "[⚡$count ](bold red)"
stashed = "[≡$count ](overlay2)"
renamed    = "[»$count ](blue)"

[cmd_duration]
format = "[$duration]($style) "
style = "bold yellow"

[python]
format = "[$virtualenv](green) "
detect_extensions = []
detect_files = []
