# Enable Colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'


# Prefix Key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Window and pane index start at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Attach to another session instead of detaching when last window closes
set -g detach-on-destroy off

# Better clipboard integration on Wayland
# set -g set-clipboard on

# Open new windows in current directory path
bind c new-window -c "#{pane_current_path}"

# Kill pane without confirmation
bind x kill-pane

# Quick switch between last two windows
bind Space last-window

# Break pane into its own window
bind b break-pane

# Split Windows
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload Config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# Resize Panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Enable Mouse
set -g mouse on

# Scrollback
set -g history-limit 50000

# Status messages display time
set -g display-time 2000

# Status bar refresh interval
set -g status-interval 5

# VIM motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status Line Position
set-option -g status-position top

##### Plugins #####
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# ── Status bar ───────────────────────────────────────────────
set -g status-style "bg=#16161e,fg=#737aa2"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left " #S "
set -g status-right " %a %d %b "

# ── Messages, command prompt, copy-mode ──────────────────────
set -g message-style "bg=#24283b,fg=#e0af68"
set -g message-command-style "bg=#24283b,fg=#c0caf5"
set -g mode-style "bg=#e0af68,fg=#1a1b26"

# ── Panes ────────────────────────────────────────────────────
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#9d7cd8"
set -g display-panes-colour "#414868"
set -g display-panes-active-colour "#9d7cd8"
set -g clock-mode-colour "#9d7cd8"

# ── Popups (tmux >= 3.3; -q silences errors on older versions) ─
set -gq popup-style "bg=#1a1b26,fg=#c0caf5"
set -gq popup-border-style "fg=#414868"

# ── Windows ──────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#737aa2"
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style "fg=#f7768e,bold"
set -g window-status-format " 󰈚 #I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "fg=#c0caf5,bg=#24283b,bold"
set -g window-status-current-format " 󰈚 #[fg=#bb9af7]#I#[fg=#c0caf5]:#W#{?window_zoomed_flag, [Z],} "


##### Auto Save / Restore #####
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

##### Neovim CheckHealth Recommendations #####
set-option -sg escape-time 10
set-option -g focus-events on

##### Pop-Up: Session List #####
bind w display-popup -E -b rounded -T " Sessions" -w 30% -h 50% ~/.config/tmux/scripts/tmux-menu.sh

##### Pop-Up: Scratch Pad #####
# bind T display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh
# bind -T popup t send-keys t
# bind -T popup q send-keys q
# bind -T popup T detach
# bind -T popup C-[ copy-mode
# unbind -T popup Tab

##### Pop-Up: LazyGit #####
bind g display-popup -d "#{pane_current_path}" -E -b none -w 81% -h 80% lazygit

##### Pop-Up: SSH Menu #####
# bind S display-popup -E -b none -w 40% -h 50% ~/.config/tmux/scripts/tmux-ssh.sh

##### TPM Init #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
